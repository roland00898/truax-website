<script type="text/x-dc" data-dc-script data-props="{}">

  { slug: 'big-tree-ranch', name: 'Big Tree Ranch', place: 'Texas Hill Country', src: __A('assets/bigtree-dusk.jpg'), pos: '50% 50%', posPhone: '50% 50%' },
];

class Component extends DCLogic {
  state = { i: 0, phone: typeof window !== 'undefined' && window.innerWidth <= 700 };
  componentDidMount() {
    this._step = (n) => this.setState((s) => ({ i: (s.i + n + SLIDES.length) % SLIDES.length }));
    this._onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); this._step(1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this._step(-1); }
    };
    window.addEventListener('keydown', this._onKey);
    this._onResize = () => this.setState({ phone: window.innerWidth <= 700 });
    window.addEventListener('resize', this._onResize);

    // swipe on touch
    this._x = null;
    this._onStart = (e) => { this._x = e.touches[0].clientX; };
    this._onEnd = (e) => {
      if (this._x === null) return;
      const dx = e.changedTouches[0].clientX - this._x;
      if (Math.abs(dx) > 46) this._step(dx < 0 ? 1 : -1);
      this._x = null;

    window.addEventListener('touchend', this._onEnd, { passive: true });
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('touchstart', this._onStart);
    window.removeEventListener('touchend', this._onEnd);
