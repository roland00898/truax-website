<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__SM=window.matchMedia('(max-width: 820px)').matches;window.__A=function(p){return window.__SM&&typeof p==='string'?p.replace(/^(\.\/|assets\/)/,'assets-sm/'):p;};</script>
<style>
    @media (max-width: 820px) {
      [data-page-bg] { background-image: url('assets-sm/tile-mosaic-bg.jpg') !important; }
      [data-hero] { background-image: url('assets-sm/titlecard-imber.jpg') !important; }
    }
  </style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Cormorant+Garamond:wght@400;500;600&amp;display=swap">
  <style>
    @media (max-width: 760px) {
      [data-hero] { height: 64vh !important; min-height: 400px !important; background-position: 55% 48% !important; }
      [data-hero] > [role="img"] { background-position: 55% 48% !important; }
    }
    [data-mobile-menu] { display: none; }
    [data-mobile-menu] summary { list-style: none; cursor: pointer; }
    [data-mobile-menu] summary::-webkit-details-marker { display: none; }
    @media (max-width: 1024px) {
      [data-desktop-nav] { display: none !important; }
      [data-mobile-menu] { display: block !important; }
    }
    @media (max-width: 760px) {
      [data-glass-bar] { gap: 10px !important; padding: 0 14px !important; }
    }
    body { margin: 0; }
    [data-glass] { -webkit-backdrop-filter: blur(30px) saturate(1.7); }
    a { color: #1b1b1a; }
    a:hover { color: #6b6b66; }
  </style>
</helmet>

<div style="background: #eceef1; fontFamily: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1b1b1a; position: relative">


  <div data-page-bg="true" style="position: fixed; inset: 0; zIndex: 0; backgroundImage: url('./tile-mosaic-bg.jpg'); backgroundSize: cover; backgroundPosition: 50% 72%; filter: {{ bgFilter }}; transform: scale(1.08); pointerEvents: none"></div>
  <div style="position: fixed; inset: 0; zIndex: 0; background: {{ bgVeil }}; pointerEvents: none"></div>
  <div style="position: sticky; top: 0; zIndex: 10; height: 0">
    <div style="padding: 14px 24px">
    <div style="maxWidth: 1120px; margin: 0 auto; transform: translateX(calc(-1 * min(48px, max(0px, (100vw - 48px - 1120px) / 2))))">
      
    </div><div data-glass="true" data-glass-bar="true" style="position: relative; display: grid; gridTemplateColumns: 1fr auto 1fr; alignItems: center; gap: 32px; minHeight: 62px; padding: 0 26px; borderRadius: 999px; background: {{ barBg }}; transition: background 260ms ease; backdropFilter: blur(30px) saturate(1.7); WebkitBackdropFilter: blur(30px) saturate(1.7); border: 1px solid transparent; borderTopColor: rgba(255,255,255,0.5); borderLeftColor: rgba(255,255,255,0.4); boxShadow: inset 0 0 26px rgba(255,255,255,0.2), 0 12px 34px rgba(20,20,18,0.16)">
        
        <a href="https://www.instagram.com/truaxconstruction/" target="_blank" rel="noopener" aria-label="Instagram" style="justifySelf: start; position: relative; width: 24px; height: 24px; borderRadius: 8px; border: 2.4px solid rgba(255,255,255,0.92); display: block; opacity: 0.9; transition: opacity 200ms ease, background 200ms ease" style-hover="opacity: 1; background: rgba(255,255,255,0.14)">
          <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; borderRadius: 999px; border: 2.4px solid rgba(255,255,255,0.92)"></span>
          <span style="position: absolute; right: 2px; top: 2px; width: 4px; height: 4px; borderRadius: 999px; background: rgba(255,255,255,0.9)"></span>
        </a>
        <a href="index.html" style="justifySelf: center; display: block; lineHeight: 0"><img src="./truax-logo-white-inline.png" alt="Truax Construction — home" style="justifySelf: center; width: clamp(180px, 46vw, 440px); height: auto; display: block; filter: drop-shadow(0 1px 8px rgba(0,0,0,0.35))"></a><div data-desktop-nav="true" style="justifySelf: end; display: flex; flexShrink: 0; gap: 6px; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontWeight: 500; fontSize: 12.5px; letterSpacing: 0.2em; textTransform: uppercase">
          <a href="about.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; opacity: 0.88; padding: 7px 12px; borderRadius: 999px; transition: background 200ms ease, opacity 200ms ease" style-hover="background: rgba(255,255,255,0.16); opacity: 1">About</a>
          <a href="projects.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; padding: 7px 12px; borderRadius: 999px; background: rgba(255,255,255,0.16)">Projects</a>
          <a href="services.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; opacity: 0.88; padding: 7px 12px; borderRadius: 999px; transition: background 200ms ease, opacity 200ms ease" style-hover="background: rgba(255,255,255,0.16); opacity: 1">Services</a>
          <a href="contact.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; opacity: 0.88; padding: 7px 12px; borderRadius: 999px; transition: background 200ms ease, opacity 200ms ease" style-hover="background: rgba(255,255,255,0.16); opacity: 1">Contact</a>
        </div>
        <details data-mobile-menu style="justifySelf: end; position: relative">
          <summary aria-label="Menu" style="display: flex; alignItems: center; justifyContent: center; width: 44px; height: 44px; borderRadius: 999px; color: #ffffff">
            <span style="display: block; width: 20px; height: 12px; borderTop: 2px solid rgba(255,255,255,0.92); borderBottom: 2px solid rgba(255,255,255,0.92); position: relative">
              <span style="position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: rgba(255,255,255,0.92)"></span>
            </span>
          </summary>
          <div style="position: absolute; right: 0; top: 52px; minWidth: 200px; display: flex; flexDirection: column; padding: 10px; borderRadius: 20px; background: rgba(22,23,24,0.72); backdropFilter: blur(26px) saturate(1.4); WebkitBackdropFilter: blur(26px) saturate(1.4); border: 1px solid rgba(255,255,255,0.22); boxShadow: 0 22px 48px rgba(0,0,0,0.42)">
            <a href="about.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">About</a>
            <a href="projects.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">Projects</a>
            <a href="services.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">Services</a>
            <a href="contact.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">Contact</a>
          </div>
        </details>

      </div>
    </div>
  </div>

  <div data-hero="true" style="position: relative; zIndex: 1; height: 82vh; minHeight: 560px; overflow: hidden; background-image: url('./titlecard-imber.jpg'); backgroundSize: cover; backgroundPosition: 62% 46%; backgroundRepeat: no-repeat">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 260px; background: linear-gradient(to bottom, rgba(16,18,20,0.5) 0%, rgba(16,18,20,0.22) 55%, rgba(16,18,20,0) 100%); pointerEvents: none"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 clamp(14px, 2vw, 28px) clamp(32px, 6vw, 56px)">
      <div style="maxWidth: 1760px; margin: 0 auto">
        <div style="color: #ffffff; fontSize: clamp(28px, 7vw, 44px); lineHeight: 1.12; letterSpacing: -0.01em; textWrap: pretty; textShadow: 0 2px 22px rgba(0,0,0,0.42); maxWidth: 15em">Projects</div>
      </div>
    </div>
  </div>

  <div style="position: relative; zIndex: 1; maxWidth: 1760px; margin: 0 auto; padding: clamp(28px, 6vw, 56px) clamp(14px, 2vw, 28px) 96px">
    <div onMouseLeave="{{ clearHover }}" style="display: grid; gridTemplateColumns: {{ gridCols }}; columnGap: clamp(16px, 3vw, 40px); rowGap: clamp(20px, 3vw, 40px)">
      <sc-for list="{{ tiles }}" as="t">
        <a href="{{ t.href }}" data-glass="true" ref="{{ t.revealRef }}" onMouseEnter="{{ t.enter }}" style="position: relative; display: block; textDecoration: none; color: inherit; opacity: {{ t.revealOpacity }}; willChange: opacity, transform; padding: clamp(20px, 5.5vw, 30px); borderRadius: 22px; background: rgba(255,255,255,0.5); backdropFilter: blur(30px) saturate(0.85); WebkitBackdropFilter: blur(30px) saturate(0.85); border: 1px solid transparent; borderTopColor: rgba(255,255,255,0.5); borderLeftColor: rgba(255,255,255,0.4); boxShadow: inset 0 0 26px rgba(255,255,255,0.2), 0 12px 34px rgba(20,20,18,0.16); transform: {{ t.revealShift }}; transition: box-shadow 300ms ease" style-hover="boxShadow: inset 0 0 26px rgba(255,255,255,0.26), 0 20px 44px rgba(20,20,18,0.24)">
          <div style="position: relative; aspectRatio: {{ t.ratio }}; overflow: hidden; borderRadius: 8px; background: #d8dade">
            <div role="img" aria-label="{{ t.name }}" style="position: absolute; inset: 0; backgroundImage: {{ t.bg }}; backgroundSize: cover; backgroundPosition: {{ t.pos }}; backgroundRepeat: no-repeat; filter: {{ t.filter }}; transition: filter 300ms ease"></div>
            <div style="position: absolute; inset: 0; display: flex; alignItems: {{ t.labelAlignY }}; justifyContent: {{ t.labelAlignX }}; textAlign: {{ t.labelTextAlign }}; padding: clamp(18px, 5vw, 28px); background: {{ t.labelScrim }}; display: {{ t.overlayDisplay }}; opacity: {{ t.labelOpacity }}; transition: opacity 260ms ease">
              <div style="color: #ffffff; fontSize: clamp(14px, 3.6vw, 17px); lineHeight: 1.6; letterSpacing: 0.1em; textTransform: uppercase; textShadow: 0 1px 4px rgba(0,0,0,0.65); maxWidth: 16em; textWrap: pretty">{{ t.name }}</div>
            </div>
          </div>
          <div style="display: {{ t.captionDisplay }}; padding: 16px 2px 2px; color: #1b1b1a; fontSize: clamp(13px, 3.4vw, 15px); lineHeight: 1.5; letterSpacing: 0.14em; textTransform: uppercase; textWrap: pretty">{{ t.name }}</div>
        </a>
      </sc-for>
    </div>  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;featuredFocalY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:72,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Featured photo framing&quot;},&quot;featuredFocalX&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:50,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Featured photo framing&quot;},&quot;featuredZoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:1.8,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Featured photo framing&quot;}}">
const PHOTOS = [
  {
    "src": __A("./260609_campherd_8472p25_web-mtpw1yui-7kgp.jpg"),
    "name": "Hill Country Residence",
    "pos": "50% 74%"
  },
  {
    "src": __A("./gregory-exterior-front-wide-mtpwhmud-n8tx.jpg"),
    "name": "Georgian Colonial",
    "pos": "50% 50%"
  },
  {
    "src": "./project-alfaro-wide.jpg",
    "name": "Modern Legacy",
    "pos": "50% 58%"
  },
  {
    "src": __A("./project-lindquist-cabinetry.jpg"),
    "name": "Floating Library",
    "pos": "50% 50%"
  },
  {
    "src": __A("./ph-great-room.jpg"),
    "name": "High Rise Penthouse",
    "pos": "50% 34%"
  },
  {
    "src": __A("./project-courtyard-oak.jpg"),
    "name": "Sunday Home",
    "pos": "50% 50%"
  },
  {
    "src": __A("./project-hacienda.jpg"),
    "name": "Hacienda Residence",
    "pos": "50% 50%"
  },
  {
    "src": __A("./project-szabo-exterior.jpg"),
    "name": "Hidden Wells",
    "pos": "50% 50%"
  },
  {
    "src": __A("./exterior2--2019_03_15-12_47_22-utc--mtpwk12u-gyck.jpg"),
    "name": "Millyard Renovation",
    "pos": "50% 50%"
  },
  {
    "src": __A("./project-ranch-wide.jpg"),
    "name": "Big Tree Ranch",
    "pos": "50% 62%"
  },
  {"src":__A("./project-terraced-garden.jpg"),"name":"Terraced Garden","pos":"50% 50%"},
  {"src":__A("./ravine-hero.jpg"),"name":"Ravine Residence","pos":"50% 50%"},
  {"src":__A("./project-imber-pond.jpg"),"name":"Imber Hill Country","pos":"50% 55%"},
  {"src":__A("./lostres-hero-pool.jpg"),"name":"Los Tres Dos","pos":"50% 50%"},
  {"src":__A("./southtexas-dusk-oaks.jpg"),"name":"South Texas Guest Home","pos":"50% 50%"}
];

const slugify = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

class Component extends DCLogic {
  _els = [];
  state = { barDark: false, touch: false, phone: false, hover: null, rev: [], calm: false, bgP: 0 };
  componentDidMount() {
    this._onProgress = () => {
      const vh = window.innerHeight || 1;
      const next = this._els.map((el) => {
        if (!el) return 0;
        const top = el.getBoundingClientRect().top;
        return Math.max(0, Math.min(1, (vh * 0.96 - top) / (vh * 0.38)));
      });
      const prev = this.state.rev;
      let changed = next.length !== prev.length;
      if (!changed) {
        for (let i = 0; i < next.length; i++) {
          if (Math.abs(next[i] - prev[i]) > 0.004) { changed = true; break; }
        }
      }
      // the tile floor comes into focus as you move down the page
      const bgP = Math.max(0, Math.min(1, window.scrollY / (vh * 0.4)));
      if (Math.abs(bgP - this.state.bgP) > 0.004) changed = true;
      if (changed) this.setState({ rev: next, bgP: bgP });
    };
    this._tick = () => { this._raf = null; this._onProgress(); };
    this._queue = () => { if (!this._raf) this._raf = requestAnimationFrame(this._tick); };
    window.addEventListener('scroll', this._queue, { passive: true });
    window.addEventListener('resize', this._queue);
    this._onProgress();
    const rm = window.matchMedia('(prefers-reduced-motion: reduce)');
    this._rm = rm;
    this._onRm = () => this.setState({ calm: rm.matches });
    rm.addEventListener('change', this._onRm);
    this._onRm();
    const mq = window.matchMedia('(hover: none), (pointer: coarse), (max-width: 1024px)');
    this._mq = mq;
    const mqPhone = window.matchMedia('(max-width: 700px)');
    this._mqPhone = mqPhone;
    this._onMq = () => this.setState({ touch: mq.matches, phone: mqPhone.matches });
    mqPhone.addEventListener('change', this._onMq);
    mq.addEventListener('change', this._onMq);
    this._onMq();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._queue);
    window.removeEventListener('resize', this._queue);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._mq) this._mq.removeEventListener('change', this._onMq);
    if (this._rm) this._rm.removeEventListener('change', this._onRm);
  }
  renderVals() {
    const touch = this.state.touch;
    const b = this.state.calm ? 1 : this.state.bgP;
    const calm = this.state.calm;
    const ease = (t) => (calm ? 1 : 1 - Math.pow(1 - t, 3));
    return {
      bgFilter: 'blur(' + (5 - b * 4.4).toFixed(2) + 'px) saturate(' + (0.62 + b * 0.5).toFixed(2) + ')',
      bgVeil: 'rgba(238,240,243,' + (0.7 - b * 0.34).toFixed(3) + ')',
      barBg: this.state.barDark ? 'rgba(28,28,26,0.62)' : 'rgba(255,255,255,0.34)',
      scrimBgUnused: 'rgba(18,19,20,0.42)',
      featuredFocal: (this.props.featuredFocalX ?? 50) + '% ' + (this.props.featuredFocalY ?? 72) + '%',
      featuredZoom: this.props.featuredZoom ?? 1,
      clearHover: () => this.setState({ hover: null }),
      tiles: (() => {
        const cols = touch ? 1 : 3;
        const lastRowStart = (Math.ceil(PHOTOS.length / cols) - 1) * cols;
        return PHOTOS.map((p, i) => ({
          bg: 'url("' + p.src + '")', name: p.name, pos: p.pos,
          href: 'project.html?p=' + slugify(p.name),
          filter: ((!touch && this.state.hover === i) ? 'brightness(0.55) saturate(0.85) ' : '')
            + 'blur(' + ((1 - ease(this.state.rev[i] ?? 0)) * 0.9).toFixed(2) + 'px)',
          revealRef: (el) => { this._els[i] = el; },
          revealOpacity: ease(this.state.rev[i] ?? 0).toFixed(3),
          revealShift: 'translateY(' + ((1 - ease(this.state.rev[i] ?? 0)) * 14).toFixed(2) + 'px)',
          labelOpacity: touch ? 0 : (this.state.hover === i ? 1 : 0),
          captionDisplay: touch ? 'block' : 'none',
          overlayDisplay: touch ? 'none' : 'flex',
          ratio: touch ? '1 / 1' : '3 / 2',
          labelAlignY: touch ? 'flex-end' : 'center',
          labelAlignX: touch ? 'flex-start' : 'center',
          labelTextAlign: touch ? 'left' : 'center',
          labelScrim: touch
            ? 'linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.34) 30%, rgba(0,0,0,0.06) 58%, rgba(0,0,0,0) 78%)'
            : 'rgba(16,17,18,0.48)',
          enter: () => this.setState({ hover: i }),
          vLine: (i % cols) === cols - 1 ? 'none' : 'block',
          hLine: i < lastRowStart ? 'block' : 'none',
        }));
      })(),
      gridCols: this.state.phone ? '1fr' : (touch ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)'),
      labelShadow: '0 1px 3px rgba(0,0,0,0.7), 0 2px 18px rgba(0,0,0,0.55)',
    };
  }
}

</script>
</body>
</html>
