const asset = (p) => {
  const id = RES[p];
  const map = (typeof window !== 'undefined' && window.__resources) || null;
  return (id && map && map[id]) || p;
};

class Component extends DCLogic {
  state = { barDark: false, slug: null, lb: null };
  componentDidMount() {
    const q = new URLSearchParams(location.search).get('p');
    this.setState({ slug: q });
    this._onKey = (e) => {
      if (this.state.lb === null) return;
      if (e.key === 'Escape') this.setState({ lb: null });
      if (e.key === 'ArrowRight') this._step(1);
      if (e.key === 'ArrowLeft') this._step(-1);
    };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
  }
  _all() {
    const p = this._current();
    return [{ src: p.hero, pos: p.pos }].concat(p.photos);
  }
  _current() {
    let i = PROJECTS.findIndex(p => p.slug === this.state.slug);
    return PROJECTS[i < 0 ? 0 : i];
  }
  _step(n) {
    const all = this._all();
    this.setState(s => ({ lb: (s.lb + n + all.length) % all.length }));
  }
  _applyPageBg() {
    const el = this._bgEl;
    if (!el) return;
    const resolved = asset('assets/tile-mosaic-bg.jpg');
    if (resolved !== 'assets/tile-mosaic-bg.jpg') el.style.backgroundImage = 'url("' + resolved + '")';
  }
  renderVals() {
    let i = PROJECTS.findIndex(p => p.slug === this.state.slug);
    if (i < 0) i = 0;
    const p = PROJECTS[i];
    const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length];
    const next = PROJECTS[(i + 1) % PROJECTS.length];
    const all = [{ src: p.hero, pos: p.pos }].concat(p.photos);
    const lb = this.state.lb;
    return {
      isEmpty: p.photos.length === 0,
      lightboxOpen: lb !== null,
      lightboxBg: lb !== null ? 'url("' + asset(all[lb].src) + '")' : 'none',
      lightboxLabel: lb !== null ? p.name + ' — ' + (lb + 1) + ' / ' + all.length : '',
      openHero: () => this.setState({ lb: 0 }),
      closeLightbox: () => this.setState({ lb: null }),
      prevPhoto: (e) => { e.stopPropagation(); this._step(-1); },
      nextPhoto: (e) => { e.stopPropagation(); this._step(1); },
      bgRef: (el) => { this._bgEl = el; this._applyPageBg(); },
      barBg: this.state.barDark ? 'rgba(28,28,26,0.62)' : 'rgba(255,255,255,0.34)',
      name: p.name,
      heroBg: 'url("' + asset(p.hero) + '")',
      heroPos: p.pos,
      gallery: p.photos.map((g, gi) => ({ bg: 'url("' + asset(g.src) + '")', pos: g.pos, open: () => this.setState({ lb: gi + 1 }) })),
      prevHref: 'project.html?p=' + prev.slug,
      prevName: prev.name,
      nextHref: 'project.html?p=' + next.slug,
      nextName: next.name,
    };
  }
}
