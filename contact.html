<script type="text/x-dc" data-dc-script>
// Paste the Formspree form id here (from your Formspree dashboard) to start receiving messages.
const FORM_ENDPOINT = 'https://formspree.io/f/mgaeqrjq';

class Component extends DCLogic {
  state = { barDark: false, touch: false, sent: false, bgP: 0 , calm: false };
  componentDidMount() {
    const rm = window.matchMedia('(prefers-reduced-motion: reduce)');
    this._rm = rm;
    this._onRm = () => this.setState({ calm: rm.matches });
    rm.addEventListener('change', this._onRm);
    this._onRm();
    this._onBg = () => {
      this._bgRaf = null;
      const vh = window.innerHeight || 1;
      const bgP = Math.max(0, Math.min(1, window.scrollY / (vh * 0.4)));
      const hero = document.querySelector('[data-hero]');
      // hand off to the dark bar the moment the glass capsule (bottom edge at y 78)
      // stops overlapping the hero photo
      const dark = !hero || hero.getBoundingClientRect().bottom <= 78;
      if (dark !== this.state.barDark || Math.abs(bgP - this.state.bgP) > 0.004) {
        this.setState({ bgP: bgP, barDark: dark });
      }
    };
    this._bgQueue = () => { if (!this._bgRaf) this._bgRaf = requestAnimationFrame(this._onBg); };
    window.addEventListener('scroll', this._bgQueue, { passive: true });
    window.addEventListener('resize', this._bgQueue);
    this._onBg();
    const mq = window.matchMedia('(hover: none), (pointer: coarse), (max-width: 1024px)');
    this._mq = mq;
    this._onMq = () => this.setState({ touch: mq.matches });
    mq.addEventListener('change', this._onMq);
    this._onMq();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._bgQueue);
    window.removeEventListener('resize', this._bgQueue);
    if (this._bgRaf) cancelAnimationFrame(this._bgRaf);
    if (this._rm) this._rm.removeEventListener('change', this._onRm);
    if (this._mq) this._mq.removeEventListener('change', this._onMq);
  }
  renderVals() {
    const touch = this.state.touch;
    const calm = this.state.calm;
    const b = calm ? 1 : this.state.bgP;
    return {
      bgFilter: 'blur(' + (5 - b * 4.4).toFixed(2) + 'px) saturate(' + (0.62 + b * 0.5).toFixed(2) + ')',
      bgVeil: 'rgba(238,240,243,' + (0.7 - b * 0.34).toFixed(3) + ')',
      sent: this.state.sent,
      sentNote: this.state.note,
      sending: this.state.sending,
      sendLabel: this.state.sending ? 'Sending…' : 'Send',
      submit: (e) => {
        e.preventDefault();
        if (this.state.sending) return;
        const val = (k) => {
          const el = document.querySelector('[data-field="' + k + '"]');
          return el ? (el.value || '').trim() : '';
        };
        const kind = val('kind');
        const payload = {
          name: val('name'),
          email: val('email'),
          phone: val('phone'),
          projectType: kind && kind !== 'What kind of project?' ? kind : '',
          message: val('message'),
          _subject: 'Project inquiry' + (val('name') ? ' — ' + val('name') : ''),
        };
        if (!payload.name || !payload.email) {
          this.setState({ note: 'Please add your name and email so we can reply.' });
          return;
        }
        if (FORM_ENDPOINT.indexOf('YOUR_FORM_ID') !== -1) {
          this.setState({ note: 'This form is not connected yet. Call the office at (830) 980-3399 or email office@truaxinc.com.' });
          return;
        }
        this.setState({ sending: true, note: '' });
        fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
        })
          .then((r) => {
            if (!r.ok) throw new Error('bad status');
            ['name', 'email', 'phone', 'message'].forEach((k) => {
              const el = document.querySelector('[data-field="' + k + '"]');
              if (el) el.value = '';
            });
            this.setState({ sending: false, note: 'Thank you — your message is on its way. We will be in touch shortly.' });
          })
          .catch(() => {
            this.setState({ sending: false, note: 'Something went wrong sending that. Please call (830) 980-3399 or email office@truaxinc.com.' });
          });
      },
      barBg: this.state.barDark ? 'rgba(28,28,26,0.62)' : 'rgba(255,255,255,0.34)',
      scrimBg: touch
        ? 'linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 46%)'
        : 'rgba(20,20,19,0.46)',
      scrimRest: touch ? 1 : 0,
      labelShadow: touch ? '0 1px 12px rgba(0,0,0,0.4)' : 'none',
      projects: [
        { name: 'Riverbend Residence' },
        { name: 'Millyard Renovation' },
        { name: 'Oak Street Duplex' },
        { name: 'Harbor Works Addition' },
      ],
    };
  }
}

</script>
