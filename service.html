<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__SM=window.matchMedia('(max-width: 820px)').matches;window.__A=function(p){return window.__SM&&typeof p==='string'?p.replace(/^(\.\/|assets\/)/,'assets-sm/'):p;};</script>
<style>
    @media (max-width: 820px) {
      [data-page-bg] { background-image: url('assets-sm/tile-mosaic-bg.jpg') !important; }
    }
  </style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;display=swap">
  <style>
    @media (max-width: 760px) {
      [data-hero] { height: 64vh !important; min-height: 400px !important; background-position: 55% 48% !important; }
      [data-hero] > [role="img"] { background-position: 55% 48% !important; }
    }
    [data-mobile-menu] { display: none; }
    [data-mobile-menu] summary { list-style: none; cursor: pointer; }
    [data-mobile-menu] summary::-webkit-details-marker { display: none; }
    @media (max-width: 1024px) {
      [data-desktop-nav] { display: none !important; }
      [data-mobile-menu] { display: block !important; }
    }
    @media (max-width: 760px) {
      [data-glass-bar] { gap: 10px !important; padding: 0 14px !important; }
    }
    body { margin: 0; }
    [data-glass] { -webkit-backdrop-filter: blur(30px) saturate(1.7); }
    a { color: #1b1b1a; }
    a:hover { color: #6b6b66; }
  </style>
</helmet>

<div style="background: #eceef1; fontFamily: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1b1b1a; position: relative">

  <div style="position: fixed; inset: 0; zIndex: 0; backgroundImage: {{ tileBg }}; backgroundSize: cover; backgroundPosition: center; filter: {{ bgFilter }}; transform: scale(1.08); pointerEvents: none"></div>
  <div style="position: fixed; inset: 0; zIndex: 0; background: {{ bgVeil }}; pointerEvents: none"></div>

  <div style="position: sticky; top: 0; zIndex: 10; height: 0">
    <div style="padding: 14px 24px">
      <div data-glass="true" data-glass-bar="true" style="position: relative; display: grid; gridTemplateColumns: 1fr auto 1fr; alignItems: center; gap: 32px; minHeight: 62px; padding: 0 26px; borderRadius: 999px; background: {{ barBg }}; transition: background 260ms ease; backdropFilter: blur(30px) saturate(1.7); WebkitBackdropFilter: blur(30px) saturate(1.7); border: 1px solid transparent; borderTopColor: rgba(255,255,255,0.5); borderLeftColor: rgba(255,255,255,0.4); boxShadow: inset 0 0 26px rgba(255,255,255,0.2), 0 12px 34px rgba(20,20,18,0.16)">
        <a href="https://www.instagram.com/truaxconstruction/" target="_blank" rel="noopener" aria-label="Instagram" style="justifySelf: start; position: relative; width: 24px; height: 24px; borderRadius: 8px; border: 2.4px solid rgba(255,255,255,0.92); display: block; opacity: 0.9; transition: opacity 200ms ease, background 200ms ease" style-hover="opacity: 1; background: rgba(255,255,255,0.14)">
          <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; borderRadius: 999px; border: 2.4px solid rgba(255,255,255,0.92)"></span>
          <span style="position: absolute; right: 2px; top: 2px; width: 4px; height: 4px; borderRadius: 999px; background: rgba(255,255,255,0.9)"></span>
        </a>
        <a href="index.html" style="justifySelf: center; display: block; lineHeight: 0"><img src="assets/truax-logo-white-inline.png" alt="Truax Construction — home" style="width: clamp(180px, 46vw, 440px); maxWidth: 100%; height: auto; display: block; filter: drop-shadow(0 1px 8px rgba(0,0,0,0.35))"></a>
        <div data-desktop-nav="true" style="justifySelf: end; display: flex; flexShrink: 0; gap: 6px; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontWeight: 500; fontSize: 12.5px; letterSpacing: 0.2em; textTransform: uppercase">
          <a href="about.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; opacity: 0.88; padding: 7px 12px; borderRadius: 999px; transition: background 200ms ease, opacity 200ms ease" style-hover="background: rgba(255,255,255,0.16); opacity: 1">About</a>
          <a href="projects.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; opacity: 0.88; padding: 7px 12px; borderRadius: 999px; transition: background 200ms ease, opacity 200ms ease" style-hover="background: rgba(255,255,255,0.16); opacity: 1">Projects</a>
          <a href="services.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; padding: 7px 12px; borderRadius: 999px; background: rgba(255,255,255,0.16)">Services</a>
          <a href="contact.html" style="color: #ffffff; textShadow: 0 1px 10px rgba(0,0,0,0.45); textDecoration: none; opacity: 0.88; padding: 7px 12px; borderRadius: 999px; transition: background 200ms ease, opacity 200ms ease" style-hover="background: rgba(255,255,255,0.16); opacity: 1">Contact</a>
        </div>
        <details data-mobile-menu style="justifySelf: end; position: relative">
          <summary aria-label="Menu" style="display: flex; alignItems: center; justifyContent: center; width: 44px; height: 44px; borderRadius: 999px; color: #ffffff">
            <span style="display: block; width: 20px; height: 12px; borderTop: 2px solid rgba(255,255,255,0.92); borderBottom: 2px solid rgba(255,255,255,0.92); position: relative">
              <span style="position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: rgba(255,255,255,0.92)"></span>
            </span>
          </summary>
          <div style="position: absolute; right: 0; top: 52px; minWidth: 200px; display: flex; flexDirection: column; padding: 10px; borderRadius: 20px; background: rgba(22,23,24,0.72); backdropFilter: blur(26px) saturate(1.4); WebkitBackdropFilter: blur(26px) saturate(1.4); border: 1px solid rgba(255,255,255,0.22); boxShadow: 0 22px 48px rgba(0,0,0,0.42)">
            <a href="about.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">About</a>
            <a href="projects.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">Projects</a>
            <a href="services.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">Services</a>
            <a href="contact.html" style="color: #ffffff; textDecoration: none; padding: 15px 16px; borderRadius: 12px; minHeight: 44px; boxSizing: border-box; display: flex; alignItems: center; fontFamily: 'Trebuchet MS', Archivo, Helvetica, sans-serif; fontSize: 13px; letterSpacing: 0.18em; textTransform: uppercase" style-hover="background: rgba(255,255,255,0.14)">Contact</a>
          </div>
        </details>

      </div>
    </div>
  </div>

  <div data-hero="true" style="position: relative; zIndex: 1; height: 62vh; minHeight: 380px; overflow: hidden; background: #d8dade">
    <div role="img" aria-label="{{ name }}" style="position: absolute; inset: 0; backgroundImage: {{ heroBg }}; backgroundSize: cover; backgroundPosition: {{ heroPos }}; backgroundRepeat: no-repeat"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 260px; background: linear-gradient(to bottom, rgba(16,18,20,0.5) 0%, rgba(16,18,20,0.22) 55%, rgba(16,18,20,0) 100%); pointerEvents: none"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 clamp(14px, 2vw, 28px) clamp(28px, 6vw, 44px)">
      <div style="maxWidth: 1760px; margin: 0 auto; display: flex; flexDirection: column; gap: 12px">
        <div style="color: #ffffff; fontSize: clamp(28px, 3.4vw, 44px); lineHeight: 1.1; letterSpacing: -0.01em; textShadow: 0 2px 22px rgba(0,0,0,0.42)">{{ name }}</div>
      </div>
    </div>
  </div>

  <div style="position: relative; zIndex: 1; maxWidth: 1760px; margin: 0 auto; padding: clamp(26px, 6vw, 48px) clamp(14px, 2vw, 28px) 40px; display: grid; gridTemplateColumns: {{ gridCols }}; gap: 24px">
    <sc-for list="{{ glassGallery }}" as="g">
      <div onClick="{{ g.open }}" style="position: relative; padding: clamp(20px, 2.4vw, 30px); borderRadius: 22px; background: rgba(255,255,255,0.5); backdropFilter: blur(30px) saturate(0.85); WebkitBackdropFilter: blur(30px) saturate(0.85); border: 1px solid transparent; borderTopColor: rgba(255,255,255,0.5); borderLeftColor: rgba(255,255,255,0.4); boxShadow: inset 0 0 26px rgba(255,255,255,0.2), 0 12px 34px rgba(20,20,18,0.16); cursor: zoom-in; transition: box-shadow 300ms ease" style-hover="boxShadow: inset 0 0 26px rgba(255,255,255,0.26), 0 20px 44px rgba(20,20,18,0.24)">
        <div style="position: relative; aspectRatio: 3 / 2; overflow: hidden; background: #d8dade">
          <div role="img" aria-label="{{ name }}" style="position: absolute; inset: 0; backgroundImage: {{ g.bg }}; backgroundSize: cover; backgroundPosition: {{ g.pos }}; backgroundRepeat: no-repeat; transition: transform 400ms ease" style-hover="transform: scale(1.03)"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; zIndex: 1; maxWidth: 1760px; margin: 0 auto; padding: 24px clamp(16px, 2vw, 28px) 96px; borderTop: 1px solid rgba(0,0,0,0.12); display: flex; justifyContent: space-between; gap: 20px; flexWrap: wrap; fontSize: 12px; letterSpacing: 0.14em; textTransform: uppercase">
    <a href="{{ prevHref }}" style="color: #1b1b1a; textDecoration: none; opacity: 0.7; transition: opacity 200ms ease" style-hover="opacity: 1">← {{ prevName }}</a>
    <a href="services.html" style="color: #1b1b1a; textDecoration: none; opacity: 0.5; transition: opacity 200ms ease" style-hover="opacity: 1">All services</a>
    <a href="{{ nextHref }}" style="color: #1b1b1a; textDecoration: none; opacity: 0.7; transition: opacity 200ms ease" style-hover="opacity: 1">{{ nextName }} →</a>
  </div>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLightbox }}" style="position: fixed; inset: 0; zIndex: 200; background: rgba(10,11,12,0.95); display: flex; alignItems: center; justifyContent: center; cursor: zoom-out">
      <div role="img" aria-label="{{ name }}" style="position: absolute; top: clamp(20px, 8vw, 72px); right: clamp(20px, 8vw, 72px); bottom: clamp(52px, 8vw, 72px); left: clamp(20px, 8vw, 72px); backgroundImage: {{ lightboxBg }}; backgroundSize: contain; backgroundPosition: center; backgroundRepeat: no-repeat"></div>
      <div onClick="{{ prevPhoto }}" style="position: absolute; left: 0; top: 0; bottom: 0; width: 60px; display: flex; alignItems: center; justifyContent: center; color: rgba(255,255,255,0.75); fontSize: 30px; cursor: pointer; transition: color 200ms ease, background 200ms ease" style-hover="color: #fff; background: rgba(255,255,255,0.06)">‹</div>
      <div onClick="{{ nextPhoto }}" style="position: absolute; right: 0; top: 0; bottom: 0; width: 60px; display: flex; alignItems: center; justifyContent: center; color: rgba(255,255,255,0.75); fontSize: 30px; cursor: pointer; transition: color 200ms ease, background 200ms ease" style-hover="color: #fff; background: rgba(255,255,255,0.06)">›</div>
      <div onClick="{{ closeLightbox }}" style="position: absolute; top: 22px; right: 26px; color: rgba(255,255,255,0.8); fontSize: 22px; lineHeight: 1; cursor: pointer">×</div>
      <div style="position: absolute; bottom: 24px; left: 0; right: 0; textAlign: center; color: rgba(255,255,255,0.75); fontSize: 12px; letterSpacing: 0.16em; textTransform: uppercase">{{ lightboxLabel }}</div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const TILE = 'assets/tile-mosaic-bg.jpg';

const SERVICES = [
  {
    slug: 'new-builds',
    name: 'New Builds',
    copy: 'Ground-up custom homes, from site work through final finish.',
    hero: __A('assets/imber-oak-arcade.jpg'),
    pos: '50% 50%',
    photos: [
      'assets/imber-elevation.jpg', 'assets/southtexas-facade.jpg', 'assets/lostres-angled.jpg',
      'assets/ravine-approach.jpg', 'assets/bigtree-long-view.jpg', 'assets/sunday-street-view.jpg',
      'assets/hacienda-front.jpg', 'assets/szabo-ext-front.jpg', 'assets/southtexas-elevation.jpg',
    ],
  },
  {
    slug: 'pools',
    name: 'Pools',
    copy: 'Pools, spas and the decking and stonework around them.',
    hero: __A('assets/ravine-pool-day.jpg'),
    pos: '50% 50%',
    photos: [
      __A('./alfaro-exterior-angled-pool-and-house----mtpwe8gl-ox9h.jpg'), 'assets/ravine-pool-dusk.jpg',
      'assets/pool-infinity-oaks.jpg', 'assets/pool-lap-colonnade.jpg', 'assets/pool-spa-terrace.jpg',
    ],
  },
  {
    slug: 'millwork',
    name: 'Millwork',
    copy: 'Cabinetry, built-ins and paneling made for the room they go in.',
    hero: __A('assets/lindquist-library-wall.jpg'),
    pos: '50% 50%',
    photos: [
      'assets/lindquist-kitchen-cab.jpg', 'assets/lindquist-kitchen-hood.jpg', 'assets/lindquist-office-cab.jpg',
      'assets/lindquist-hidden-safe.jpg', 'assets/gregory-china-cabinet.jpg', 'assets/terraced-wine-room.jpg',
      'assets/terraced-slat-detail.jpg', 'assets/lostres-desk-row.jpg', 'assets/gregory-library.jpg',
    ],
  },
  {
    slug: 'service-work',
    name: 'Service Work',
    copy: 'Repairs, upgrades and maintenance on homes we have built and homes we have not.',
    hero: __A('assets/lostres-timber-ceiling2.jpg'),
    pos: '50% 50%',
    photos: [
      'assets/millyard-porch-detail.jpg', 'assets/bigtree-truss-detail.jpg', 'assets/szabo-fountain-spouts.jpg',
      'assets/lostres-stair-steel.jpg', 'assets/imber-porch.jpg', 'assets/herd-facade-detail.jpg',
    ],
  },
  {
    slug: 'landscaping-and-hardscaping',
    name: 'Landscaping and Hardscaping',
    copy: 'Grading, plantings, terraces, walls and walkways.',
    hero: __A('assets/terraced-garden-oaks.jpg'),
    pos: '50% 50%',
    photos: [
      'assets/sunday-oak-canopy.jpg', 'assets/szabo-ext-garden.jpg', 'assets/imber-field-pavilion.jpg',
      'assets/hacienda-side-oak.jpg', 'assets/bigtree-stone-court.jpg', 'assets/ravine-stair-path.jpg',
      'assets/herd-exterior-wildflowers.jpg',
    ],
  },
  {
    slug: 'remodels',
    name: 'Remodels',
    copy: 'Additions and whole-house renovations on existing structures.',
    hero: __A('assets/lostres-dusk-long.jpg'),
    pos: '50% 50%',
    photos: [
      'assets/millyard-oaks-dusk.jpg', 'assets/millyard-kitchen.jpg', 'assets/millyard-living.jpg',
      'assets/millyard-dining-stair.jpg', 'assets/gregory-front-door.jpg', 'assets/hacienda-back-porch.jpg',
      'assets/ph-living-fireplace.jpg', 'assets/alfaro-living-front-door.jpg', 'assets/gregory-mural-stair.jpg',
    ],
  },
];

class Component extends DCLogic {
  state = { barDark: false, touch: false, calm: false, bgP: 0, slug: null, lb: null };
  componentDidMount() {
    this.setState({ slug: new URLSearchParams(location.search).get('s') });

    const rm = window.matchMedia('(prefers-reduced-motion: reduce)');
    this._rm = rm;
    this._onRm = () => this.setState({ calm: rm.matches });
    rm.addEventListener('change', this._onRm);
    this._onRm();

    const mq = window.matchMedia('(hover: none), (pointer: coarse), (max-width: 1024px)');
    this._mq = mq;
    this._onMq = () => this.setState({ touch: mq.matches });
    mq.addEventListener('change', this._onMq);
    this._onMq();

    this._onScroll = () => {
      this._raf = null;
      const vh = window.innerHeight || 1;
      const hero = document.querySelector('[data-hero]');
      const dark = !hero || hero.getBoundingClientRect().bottom <= 78;
      const bgP = Math.max(0, Math.min(1, window.scrollY / (vh * 0.4)));
      if (dark !== this.state.barDark || Math.abs(bgP - this.state.bgP) > 0.004) {
        this.setState({ barDark: dark, bgP: bgP });
      }
    };
    this._queue = () => { if (!this._raf) this._raf = requestAnimationFrame(this._onScroll); };
    window.addEventListener('scroll', this._queue, { passive: true });
    window.addEventListener('resize', this._queue);
    this._onScroll();

    this._onKey = (e) => {
      if (this.state.lb === null) return;
      if (e.key === 'Escape') this.setState({ lb: null });
      if (e.key === 'ArrowRight') this._step(1);
      if (e.key === 'ArrowLeft') this._step(-1);
    };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._queue);
    window.removeEventListener('resize', this._queue);
    window.removeEventListener('keydown', this._onKey);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._rm) this._rm.removeEventListener('change', this._onRm);
    if (this._mq) this._mq.removeEventListener('change', this._onMq);
  }
  _current() {
    const i = SERVICES.findIndex((s) => s.slug === this.state.slug);
    return SERVICES[i < 0 ? 0 : i];
  }
  _all() {
    const s = this._current();
    return [s.hero].concat(s.photos);
  }
  _step(n) {
    const all = this._all();
    this.setState((st) => ({ lb: (st.lb + n + all.length) % all.length }));
  }
  renderVals() {
    let i = SERVICES.findIndex((s) => s.slug === this.state.slug);
    if (i < 0) i = 0;
    const s = SERVICES[i];
    const prev = SERVICES[(i - 1 + SERVICES.length) % SERVICES.length];
    const next = SERVICES[(i + 1) % SERVICES.length];
    const all = [s.hero].concat(s.photos);
    const lb = this.state.lb;
    const b = this.state.calm ? 1 : this.state.bgP;
    const asset = (p) => {
      const map = (typeof window !== 'undefined' && window.__resources) || null;
      return (map && map[p]) || p;
    };
    return {
      tileBg: 'url("' + asset(TILE) + '")',
      bgFilter: 'blur(' + (5 - b * 4.4).toFixed(2) + 'px) saturate(' + (0.62 + b * 0.5).toFixed(2) + ')',
      bgVeil: 'rgba(238,240,243,' + (0.7 - b * 0.34).toFixed(3) + ')',
      barBg: this.state.barDark ? 'rgba(28,28,26,0.62)' : 'rgba(255,255,255,0.34)',
      gridCols: this.state.touch ? '1fr' : 'repeat(3, 1fr)',
      name: s.name,
      copy: s.copy,
      heroBg: 'url("' + asset(s.hero) + '")',
      heroPos: s.pos,
      glassGallery: s.photos.map((src, gi) => ({
        bg: 'url("' + asset(src) + '")',
        pos: '50% 50%',
        open: () => this.setState({ lb: gi + 1 }),
      })),
      lightboxOpen: lb !== null,
      lightboxBg: lb !== null ? 'url("' + asset(all[lb]) + '")' : 'none',
      lightboxLabel: lb !== null ? s.name + ' — ' + (lb + 1) + ' / ' + all.length : '',
      closeLightbox: () => this.setState({ lb: null }),
      prevPhoto: (e) => { e.stopPropagation(); this._step(-1); },
      nextPhoto: (e) => { e.stopPropagation(); this._step(1); },
      prevHref: 'service.html?s=' + prev.slug,
      prevName: prev.name,
      nextHref: 'service.html?s=' + next.slug,
      nextName: next.name,
    };
  }
}

</script>
</body>
</html>
